name: Cron 15-minute jobs (worker, route-build, stock-watch)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-crons:
    runs-on: ubuntu-latest
    steps:
      - name: Worker
        run: curl -sf -o /dev/null -w "worker %{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://rumah-keripik.vercel.app/api/cron/worker"
      - name: Route build
        run: curl -sf -o /dev/null -w "route-build %{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://rumah-keripik.vercel.app/api/cron/route-build"
      - name: Stock watch
        run: curl -sf -o /dev/null -w "stock-watch %{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://rumah-keripik.vercel.app/api/cron/stock-watch"