name: Cron auto-dispatch (10 min)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-auto-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Auto dispatch
        run: curl -sf -o /dev/null -w "auto-dispatch %{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://rumah-keripik.vercel.app/api/cron/auto-dispatch"