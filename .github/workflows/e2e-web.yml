name: E2E Web (Playwright)

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Mocked E2E (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run tests against production
        run: npx playwright test --reporter=html e2e/mock-ai.spec.ts e2e/ai-provider-timeout.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: https://rumah-keripik.vercel.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
